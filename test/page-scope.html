<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>tut-code-meter 全文集計テスト</title>
<style>#bottom { margin-top: 150vh; } body { padding-bottom: 100vh; }</style>
<nav>集計対象外</nav>
<main>
  <p id="top">設計、設計、設計、設計、設計、構<b>築</b></p>
  <p hidden>非表示</p>
  <details><summary>…</summary>非表示</details>
  <p id="bottom">構築、<span>構成</span>、語彙、語彙</p>
</main>
<output id="result">検証中</output>
<script>
  // Exercise the distributed userscript on a local file, with in-memory GM storage.
  const values = { expanded: true, decorate: true };
  for (const char of '設計築成語') values['known:' + char] = true;
  let clipboard;
  const GM_getValues = () => values;
  const GM_addValueChangeListener = () => {};
  const GM = {
    getTab: async () => ({}), getTabs: async () => ({}),
    setValue: async (key, value) => { values[key] = value; },
    setValues: async changes => Object.assign(values, changes),
    setClipboard: async text => { clipboard = text; },
  };
  let panel;
  const attachShadow = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function (options) {
    const root = attachShadow.call(this, options);
    if (this.id === 'tut-code-meter') panel = root;
    return root;
  };
  let analyses = 0;
  const segment = Intl.Segmenter.prototype.segment;
  Intl.Segmenter.prototype.segment = function (text) {
    analyses++;
    return segment.call(this, text);
  };
</script>
<script src="../tut-code-meter.user.js"></script>
<script>
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  async function until(description, predicate) {
    const start = performance.now();
    while (!predicate()) {
      if (performance.now() - start > 4000) throw Error(description);
      await delay(25);
    }
  }
  const shown = (selector, value) => panel?.querySelector(selector)?.textContent === value;
  const missing = () => CSS.highlights.get('tut-code-meter-missing')?.size;
  function assert(condition, message) { if (!condition) throw Error(message); }
  async function testForgotten() {
    const settings = panel.querySelector('.save').closest('details');
    const [known, forgetInput] = settings.querySelectorAll('textarea');
    const save = settings.querySelector('.save');
    const forget = settings.querySelector('.forget');
    const feedback = forget.nextElementSibling;
    const history = settings.querySelector('ul');
    const articleChars = panel.querySelector('details');
    const buttonFor = (list, char) => list.querySelector('button[data-char="' + char + '"]');
    function edit(field, text) {
      field.value = text;
      field.dispatchEvent(new Event('input'));
    }

    edit(known, known.value + '構花');
    save.click();
    await until('習得済み字を準備', () => shown('dd', '90%（18/20字）') && !save.disabled);
    edit(known, known.value + '森');
    edit(forgetInput, ' 構構\n花 木彙');
    forget.click();
    await until('一括で忘れた字に移動', () => shown('dd', '75%（15/20字）') && history.children.length === 2);
    assert(shown('dd:nth-of-type(2)', '90%（18/20字）') && shown('dd:nth-of-type(3)', '83.3%（15/18字）'), '忘れた字を対象内の未習得に数える');
    for (const message of ['移した字（2字）：構花', '習得済みにない字：木', 'TUT-Code対象外：彙']) {
      assert(feedback.textContent.includes(message), '混在入力の結果 ' + message);
    }
    assert(!known.value.includes('構') && !known.value.includes('花') && known.value.includes('森'), '習得済み欄から移動し、他の編集中の字を保持');
    assert(buttonFor(history, '花') && !buttonFor(articleChars, '花'), '記事に現れない字も全件一覧に表示');
    const group = buttonFor(articleChars, '構').closest('ul');
    assert(group.previousElementSibling.textContent === '忘れた字' && group.textContent.includes('構　3回'), '忘れた字の出現回数');
    panel.querySelector('.copy').click();
    assert(clipboard === '構築\n構成', '忘れた字の練習語をコピー');

    edit(forgetInput, '構');
    forget.click();
    await until('二重登録を防ぐ', () => feedback.textContent.includes('すでに忘れた字：構') && history.children.length === 2);
    save.click();
    await until('編集内容の保存で忘れた字が復活しない', () => values['known:森'] === true && !save.disabled);
    assert(values['known:構'] === 'forgotten', '保存後も忘れた状態を保持');
    const range = document.createRange();
    range.selectNodeContents(document.querySelector('#bottom span'));
    getSelection().addRange(range);
    await until('選択範囲での忘れた字の頻度', () => shown('.scope', '選択範囲') && articleChars.textContent.includes('構　1回'));
    getSelection().removeAllRanges();
    await until('全文での忘れた字の頻度', () => articleChars.textContent.includes('構　3回'));

    buttonFor(history, '花').click();
    await until('全件一覧から再習得', () => history.children.length === 1 && known.value.includes('花'));
    buttonFor(articleChars, '構').click();
    await until('本文から再習得', () => shown('dd', '90%（18/20字）') && history.children.length === 0);
    edit(forgetInput, '構');
    forget.click();
    await until('再度忘れた字に登録', () => shown('dd', '75%（15/20字）'));
    edit(known, known.value + '構');
    save.click();
    await until('一括登録から再習得', () => shown('dd', '90%（18/20字）') && history.children.length === 0);
    edit(known, known.value.replace('構', ''));
    save.click();
    await until('習得済み欄からの削除は通常の未習得', () => shown('dd', '75%（15/20字）') && values['known:構'] === false);
    assert(history.children.length === 0 && buttonFor(articleChars, '構').closest('ul').previousElementSibling.textContent === '未習得字', '直接削除と忘れた字を区別');

  }
  async function testRegistrationScroll() {
    const letters = '一二三四五六七八九十上下左右大小天地山川田水火木金土月日年白黒赤青';
    const chars = panel.querySelector('details');
    const settings = panel.querySelector('.save').closest('details');
    const words = panel.querySelector('.copy').parentElement.querySelector('ul');
    const top = document.querySelector('#top');
    top.textContent = [...letters].join('、');
    document.querySelector('#bottom').textContent = '';
    chars.open = true;
    settings.open = true;
    await until('長い一覧を準備', () => chars.querySelectorAll('button').length === letters.length);
    window.scrollTo(0, 180);

    function aim(button) {
      button.scrollIntoView({ block: 'center' });
      const box = button.getBoundingClientRect();
      return [box.left + box.width / 2, box.top + box.height / 2];
    }
    async function clickAt(point, button) {
      const hit = panel.elementFromPoint(...point);
      assert(hit === button, '同じ位置で次の「' + button.dataset.char + '」を押せる');
      const pageY = window.scrollY;
      hit.click();
      await until('押した行を取り除く', () => !button.isConnected);
      await new Promise(requestAnimationFrame);
      assert(window.scrollY === pageY, '記事本文のスクロール位置を保持');
    }
    async function clickThree(list, index) {
      const buttons = [...list.querySelectorAll('button')];
      const point = aim(buttons[index]);
      for (const button of buttons.slice(index, index + 3)) await clickAt(point, button);
      assert(list.contains(buttons[index + 3]), '続きの行と一覧を再利用');
    }

    const list = chars.querySelector('button').closest('ul');
    await clickThree(list, 15);
    await clickThree(list, 0);
    const tail = list.lastElementChild;
    const previous = tail.previousElementSibling;
    const lastButton = tail.querySelector('button');
    await clickAt(aim(lastButton), lastButton);
    const lastBox = previous.querySelector('button').getBoundingClientRect();
    assert(panel.elementFromPoint(lastBox.x + lastBox.width / 2, lastBox.y + lastBox.height / 2) === previous.querySelector('button'), '末尾に残った最後の字が見える');
    assert(shown('dd', percentageFor(7, letters.length)) && words.children.length === letters.length - 7, '連続登録後のカバー率と練習候補');

    top.textContent = '春、夏、秋、冬';
    await until('短い練習候補を準備', () => words.children.length === 4 && chars.querySelectorAll('button').length === 4);
    const wordHeight = words.getBoundingClientRect().height;
    await clickThree(chars.querySelector('button').closest('ul'), 0);
    assert(words.getBoundingClientRect().height < wordHeight, '練習候補の高さが縮む');
    const only = chars.querySelector('button');
    await clickAt(aim(only), only);
    assert(!chars.querySelector('button') && shown('dd', '100%（4/4字）') && panel.querySelector('.copy').disabled, 'グループの最後の1字で集計とコピー対象を更新');

    const [known, forget] = settings.querySelectorAll('textarea');
    known.value = letters;
    known.dispatchEvent(new Event('input'));
    settings.querySelector('.save').click();
    await until('習得済みの保存', () => !settings.querySelector('.save').disabled);
    forget.value = letters;
    settings.querySelector('.forget').click();
    const history = settings.querySelector('ul');
    await until('長い忘れた字一覧を準備', () => history.children.length === letters.length);
    await clickThree(history, 15);
  }
  function percentageFor(count, total) {
    return Number((100 * count / total).toFixed(1)) + '%（' + count + '/' + total + '字）';
  }
  async function run() {
    await until('初期表示と非表示要素の除外', () => shown('.scope', 'ページ全体') && shown('dd', '75%（15/20字）') && missing() === 1);
    panel.querySelector('.copy').click();
    assert(clipboard === '構築\n構成', '先頭での全文コピー');
    const fullAnalyses = analyses;
    document.querySelector('#bottom').scrollIntoView();
    await until('スクロールで画面内の装飾を更新', () => missing() === 2);
    assert(shown('dd', '75%（15/20字）'), '末尾でも全文の字数');
    panel.querySelector('.copy').click();
    assert(clipboard === '構築\n構成' && analyses === fullAnalyses, 'スクロール・コピーは全文結果を再利用');

    const range = document.createRange();
    range.selectNodeContents(document.querySelector('#bottom span'));
    getSelection().addRange(range);
    await until('選択した語だけを集計・装飾', () => shown('.scope', '選択範囲') && shown('dd', '50%（1/2字）') && missing() === 1);
    panel.querySelector('.copy').click();
    assert(clipboard === '構成', '選択範囲のコピー');
    getSelection().removeAllRanges();
    await until('選択解除で全文を復元', () => shown('.scope', 'ページ全体') && shown('dd', '75%（15/20字）'));
    assert(analyses === fullAnalyses + 1, '選択解除は全文結果を再利用');

    await testForgotten();
    getSelection().addRange(range);
    await until('段落の再選択', () => shown('.scope', '選択範囲'));
    document.querySelector('#top').append('、構成、構成');
    await delay(250);
    assert(shown('dd', '50%（1/2字）'), '画面外の追記中も選択範囲を維持');
    getSelection().removeAllRanges();
    await until('追加された段落を一度だけ加算', () => shown('dd', '70.8%（17/24字）'));
    panel.querySelector('.copy').click();
    assert(clipboard === '構成\n構築', '追記後の全文の頻度順');
    await testRegistrationScroll();
  }
  run().then(() => { document.querySelector('#result').textContent = 'PASS'; })
    .catch(error => { document.querySelector('#result').textContent = 'FAIL: ' + error.message; });
</script>
</html>
